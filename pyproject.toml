[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iproc"
version = "0.1.0"
description = "Underwater image color-restoration and enhancement algorithm implementations (DCP, IBLA, MSF, RGHS, and others)."
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "scikit-image",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
